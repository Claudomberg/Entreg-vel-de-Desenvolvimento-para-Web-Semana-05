<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 05 - Consumo de APIs</title>
</head>
<body>
  <h1>Consumo de APIs e DOM</h1>

  <section id="cep-section">
    <h2>Buscador de CEP</h2>
    <form id="form-cep">
      <input type="text" id="input-cep" placeholder="Digite o CEP (ex: 01001000)" maxlength="8">
      <button type="submit" id="btn-cep">Buscar CEP</button>
    </form>
    <div id="status-cep" class="status"></div>
    <dl id="resultado-cep"></dl>
    
    <div class="historico">
      <h3>Histórico de Pesquisas:</h3>
      <ul id="lista-historico"></ul>
    </div>
  </section>

  <section id="pokedex-section">
    <h2>Mini Pokédex</h2>
    <form id="form-pokedex">
      <input type="text" id="input-pokemon" placeholder="Nome do Pokémon (ex: pikachu)">
      <button type="submit" id="btn-pokedex">Buscar Pokémon</button>
    </form>
    <div id="status-pokedex" class="status"></div>
    <div id="resultado-pokedex"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
